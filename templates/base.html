<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Claims</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-md bg-slate-900 text-white flex items-center justify-center text-sm font-semibold">
          HC
        </div>
        <div class="font-semibold">Hospital Claims</div>
      </div>

      {% if user %}
      <nav class="flex items-center gap-3 text-sm">
        <a class="hover:underline" href="/dashboard">Dashboard</a>
        <a class="hover:underline" href="/patients">Patients</a>
        <a class="hover:underline" href="/claims">Claims</a>
        {% if user.role in ["admin","insurer"] %}
          <a class="hover:underline" href="/audit">Audit</a>
        {% endif %}

        <span class="ml-2 px-2 py-1 text-xs rounded bg-slate-100 border">
          {{ user.role|capitalize }}
        </span>

        <form method="post" action="/logout" class="ml-2">
          <button class="px-3 py-1.5 text-sm rounded border hover:bg-slate-50">Sign out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
