{% extends "base.html" %}
{% block content %}

<h1 class="text-xl font-semibold mb-4">Submit claim</h1>

{% if error %}
  <div class="mb-4 p-3 rounded border border-red-200 bg-red-50 text-sm text-red-700">{{ error }}</div>
{% endif %}

<form method="post" action="/claims/new" class="bg-white border rounded-lg p-5 space-y-4 max-w-xl">

  {% if user.role in ["admin","staff"] %}
    <div>
      <label class="text-sm font-medium">Patient</label>
      <select name="patient_id" class="mt-1 w-full px-3 py-2 border rounded-md" required>
        {% for p in patients %}
          <option value="{{ p.id }}">{{ p.id }} — {{ p.full_name }}</option>
        {% endfor %}
      </select>
    </div>
  {% else %}
    
  {% endif %}

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div>
      <label class="text-sm font-medium">Amount</label>
      <input type="number" step="0.01" name="amount" class="mt-1 w-full px-3 py-2 border rounded-md" required />
    </div>

    <div>
      <label class="text-sm font-medium">Payer</label>
      <input name="payer" class="mt-1 w-full px-3 py-2 border rounded-md" required />
    </div>
  </div>

  <div>
    <label class="text-sm font-medium">Service date</label>
    <input name="service_date" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="YYYY-MM-DD" required />
  </div>

  <div>
    <label class="text-sm font-medium">Description</label>
    <textarea name="description" class="mt-1 w-full px-3 py-2 border rounded-md" rows="3"></textarea>
  </div>

  <div class="flex items-center gap-2">
    <button class="px-4 py-2 rounded bg-slate-900 text-white text-sm hover:bg-slate-800">Submit</button>
    <a href="/claims" class="text-sm text-slate-600 hover:underline">Cancel</a>
  </div>
</form>

{% endblock %}
