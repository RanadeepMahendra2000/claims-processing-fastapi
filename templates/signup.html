{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto bg-white border rounded-lg p-6">
  <h1 class="text-lg font-semibold">Create account</h1>
  <p class="text-sm text-slate-500 mt-1">Sign up as a patient to submit and track claims.</p>

  {% if error %}
    <div class="mt-4 p-3 rounded border border-red-200 bg-red-50 text-sm text-red-700">{{ error }}</div>
  {% endif %}

  <form class="mt-5 space-y-4" method="post" action="/signup">
    <div>
      <label class="text-sm font-medium">Email</label>
      <input name="email" class="mt-1 w-full px-3 py-2 border rounded-md" required />
    </div>

    <div>
      <label class="text-sm font-medium">Password</label>
      <input type="password" name="password" class="mt-1 w-full px-3 py-2 border rounded-md" required />
      <div class="text-xs text-slate-500 mt-1">Min 6 characters</div>
    </div>

    <div>
      <label class="text-sm font-medium">Full name</label>
      <input name="full_name" class="mt-1 w-full px-3 py-2 border rounded-md" required />
    </div>

    <div>
      <label class="text-sm font-medium">Date of birth</label>
      <input name="dob" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="YYYY-MM-DD" required />
    </div>

    <div>
      <label class="text-sm font-medium">Phone (optional)</label>
      <input name="phone" class="mt-1 w-full px-3 py-2 border rounded-md" />
    </div>

    <button class="w-full px-3 py-2 rounded-md bg-slate-900 text-white hover:bg-slate-800">
      Create account
    </button>
  </form>

  <div class="mt-4 text-sm text-slate-600">
    Already have an account?
    <a href="/login" class="hover:underline text-slate-900">Sign in</a>
  </div>
</div>

{% endblock %}
